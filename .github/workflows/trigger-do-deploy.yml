name: Trigger DO breeding dashboard rebuild
on:
  push:
    branches: [main]

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Bump CACHEBUST and trigger a real rebuild
        run: |
          set -e
          APP_ID="4a98c9f5-a6b5-40cf-bd6b-b9bbe0469a61"
          AUTH_HEADER="Authorization: Bearer ${{ secrets.DO_DEPLOY_TRIGGER_TOKEN }}"
          cat > /tmp/bump_cachebust.py << 'PYEOF'
          import json, sys, time
          d = json.load(sys.stdin)
          spec = d['app']['spec']
          envs = spec['services'][0]['envs']
          ts = str(int(time.time()))
          found = False
          for e in envs:
              if e['key'] == 'CACHEBUST':
                  e['value'] = ts
                  found = True
          if not found:
              envs.append({'key': 'CACHEBUST', 'value': ts, 'scope': 'BUILD_TIME'})
          print(json.dumps({'spec': spec}))
          PYEOF
          SPEC=$(curl -s -H "$AUTH_HEADER" "https://api.digitalocean.com/v2/apps/$APP_ID" | python3 /tmp/bump_cachebust.py)
          curl -X PUT -H "$AUTH_HEADER" -H "Content-Type: application/json" \
            --data "$SPEC" \
            "https://api.digitalocean.com/v2/apps/$APP_ID"
